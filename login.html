<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notre histoire, nos souvenirs — My Private Album</title>
  <meta name="theme-color" content="#0b0807" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <div class="scene">
    <!-- L'interrupteur réel : une case à cocher invisible, pilotée par la tirette de la lampe. -->
    <input type="checkbox" id="lamp-switch" class="lamp-switch-input" />

    <div class="scene-backdrop" aria-hidden="true"></div>
    <div class="scene-frame" aria-hidden="true"></div>

    <div class="lamp-column">
      <label for="lamp-switch" class="lamp" role="button" tabindex="0">
        <span class="sr-only">Allumer la lampe pour afficher le formulaire de connexion</span>
        <span class="lamp-glow" aria-hidden="true"></span>
        <span class="lamp-beam" aria-hidden="true"></span>
        <span class="lamp-shade" aria-hidden="true"></span>
        <span class="lamp-bulb" aria-hidden="true"></span>
        <span class="lamp-neck" aria-hidden="true"></span>
        <span class="lamp-base" aria-hidden="true"></span>
        <span class="lamp-cord" aria-hidden="true"></span>
        <span class="lamp-pull-knob" aria-hidden="true"></span>
      </label>
      <p class="lamp-hint">Tirez sur la chaînette pour retrouver nos souvenirs</p>
    </div>

    <div class="form-column">
      <div class="form-panel">
        <p class="eyebrow">Our little world</p>
        <h1>Notre histoire, nos souvenirs.</h1>
        <p class="subtitle">
          Chaque photo garde un morceau de nous. Entrez pour retrouver nos plus beaux moments.
        </p>

        <form id="login-form" novalidate>
          <label for="email">Adresse e-mail</label>
          <input id="email" type="email" autocomplete="username" required />

          <label for="password">Mot de passe</label>
          <div class="password-field">
            <input id="password" type="password" autocomplete="current-password" required />
            <button type="button" id="toggle-password" aria-label="Afficher le mot de passe" aria-pressed="false">
              <svg id="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 5c-5 0-9.27 3.11-11 7.5C2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
                />
              </svg>
              <svg id="eye-closed" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden>
                <path
                  fill="currentColor"
                  d="M2 4.27 3.28 3l18 18-1.27 1.27-3.3-3.3A11.6 11.6 0 0 1 12 20C7 20 2.73 16.89 1 12.5a13.2 13.2 0 0 1 4.17-5.53L2 4.27ZM12 7a5 5 0 0 1 5 5c0 .64-.12 1.26-.35 1.82l-1.56-1.56a3 3 0 0 0-3.9-3.9L9.63 6.8A5 5 0 0 1 12 7Zm9.9 5.5A13.2 13.2 0 0 1 17.6 17.8l-1.45-1.45A11.2 11.2 0 0 0 19.73 12.5 11.2 11.2 0 0 0 12.9 7.16L11.3 5.57C14.98 5.23 18.3 7.17 20.73 10.3c.47.6.9 1.25 1.27 1.94l-.1.26Z"
                />
              </svg>
            </button>
          </div>

          <button type="submit" id="login-submit">Entrer dans notre univers</button>
          <p id="login-error" class="auth-error" hidden></p>
        </form>

        <button id="forgot-btn" class="link-btn">Mot de passe oublié ?</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, requestPasswordReset, getSession } from "./js/auth.js";

    // Si une session valide existe déjà, inutile de rester sur la connexion.
    getSession().then((session) => {
      if (session) location.replace("index.html");
    });

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const result = await login(email, password);

      submitBtn.disabled = false;
      submitBtn.textContent = "Entrer dans notre univers";

      if (!result.ok) {
        errorEl.textContent = result.message;
        errorEl.hidden = false;
        return;
      }
      location.replace("index.html");
    });

    document.getElementById("forgot-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        errorEl.textContent = "Renseigne ton adresse e-mail pour recevoir le lien de réinitialisation.";
        errorEl.hidden = false;
        return;
      }
      await requestPasswordReset(email);
      errorEl.textContent = "Si ce compte existe, un e-mail de réinitialisation a été envoyé.";
      errorEl.hidden = false;
    });

    // --- Afficher / masquer le mot de passe (purement cosmétique, ne touche pas à auth.js) ---
    const pwdInput = document.getElementById("password");
    const toggleBtn = document.getElementById("toggle-password");
    const eyeOpen = document.getElementById("eye-open");
    const eyeClosed = document.getElementById("eye-closed");
    toggleBtn.addEventListener("click", () => {
      const showing = pwdInput.type === "text";
      pwdInput.type = showing ? "password" : "text";
      toggleBtn.setAttribute("aria-pressed", String(!showing));
      toggleBtn.setAttribute("aria-label", showing ? "Afficher le mot de passe" : "Masquer le mot de passe");
      eyeOpen.hidden = !showing;
      eyeClosed.hidden = showing;
    });

    // --- Lampe : garde l'état accessible synchronisé (clavier + lecteurs d'écran) ---
    const lampSwitch = document.getElementById("lamp-switch");
    const lampLabel = document.querySelector(".lamp");
    const syncLampA11y = () => lampLabel.setAttribute("aria-pressed", String(lampSwitch.checked));
    lampSwitch.addEventListener("change", syncLampA11y);
    syncLampA11y();

    // Si le formulaire reçoit le focus (ex. remplissage auto, clic direct sur un
    // champ via Tab), on allume la lampe pour ne jamais bloquer la connexion.
    form.addEventListener("focusin", () => {
      if (!lampSwitch.checked) lampSwitch.checked = true;
    });
  </script>
</body>
</html>
